  .ring2{width:340px;height:340px; right:-160px; bottom:-140px; border-color:var(--navy3); border-width:6px;}

    position:relative; z-index:2; width:100%; max-width:860px;

    box-shadow:0 20px 60px rgba(0,0,0,.45);
  }

  .center{text-align:center;}

  /* ---- Ruleta ---- */
  .wheel-stage{position:relative; width:100%; max-width:400px; margin:0 auto 10px; aspect-ratio:1/1;}
  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0;height:0; border-left:20px solid transparent; border-right:20px solid transparent;
    border-top:34px solid var(--gold); z-index:5;

    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);

    font-family:Cambria,Georgia,serif; font-size:34px; font-weight:bold;

const SEGMENTS = 20;          // casillas en la ruleta
const SPIN_MS = 5200;         // duración del giro

let board = [];               // [{n, q, used}]
let score = 0, played = 0;

/* ---------------- utilidades ---------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* ---------------- AUDIO (sintetizado, sin archivos) ---------------- */
let audioCtx = null;
function ac(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function beep(freq, start, dur, type, vol){
  const c = ac(); if(!c || !soundOn) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(freq, c.currentTime+start);
  g.gain.setValueAtTime(0, c.currentTime+start);
  g.gain.linearRampToValueAtTime(vol||0.18, c.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+start+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+0.02);
}

/* Suspenso: tic-tic que se va frenando + zumbido grave ascendente */
let suspenseTimers = [], suspenseNodes = [];
function startSuspense(totalMs){
  const c = ac(); if(!c || !soundOn) return;
  // zumbido grave
  const o = c.createOscillator(), g = c.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(70, c.currentTime);
  o.frequency.linearRampToValueAtTime(180, c.currentTime + totalMs/1000);
  g.gain.setValueAtTime(0.0001, c.currentTime);
  g.gain.linearRampToValueAtTime(0.05, c.currentTime+0.3);
  g.gain.linearRampToValueAtTime(0.09, c.currentTime + totalMs/1000 - 0.3);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + totalMs/1000);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + totalMs/1000 + 0.05);
  suspenseNodes.push(o);
  // tics que se separan (efecto de frenado)
  let t = 0, gap = 55;
  while(t < totalMs - 120){
    const at = t;
    suspenseTimers.push(setTimeout(()=>{ beep(1250, 0, 0.035, "square", 0.06); }, at));
    gap = gap * 1.085;      // cada vez más lento
    t += gap;
  }
}
function stopSuspense(){
  suspenseTimers.forEach(clearTimeout); suspenseTimers = [];
  suspenseNodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); suspenseNodes = [];
}
/* Bingo / victoria al detenerse */

  const notes = [523.25, 659.25, 783.99, 1046.50]; // Do–Mi–Sol–Do

  beep(1318.5, 0.42, 0.5, "sine", 0.16);
}

/* ---------------- Dibujo de la ruleta ---------------- */
function drawWheel(){
  const cv = document.getElementById("wheel");
  if(!cv) return;
  const size = 620;                 // resolución interna
  cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const cx = size/2, cy = size/2, R = size/2 - 4;
  const seg = (Math.PI*2)/SEGMENTS;
  ctx.clearRect(0,0,size,size);

  for(let i=0;i<SEGMENTS;i++){
    const start = -Math.PI/2 + i*seg;   // empieza arriba
    const end = start + seg;
    const used = board[i].used;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,start,end);
    ctx.closePath();
    if(used){ ctx.fillStyle = "#243352"; }
    else { ctx.fillStyle = (i%2===0) ? "#1B3A73" : "#28518F"; }
    ctx.fill();
    ctx.strokeStyle = used ? "#2C3E63" : "#D4AF37";
    ctx.lineWidth = 2; ctx.stroke();

    // número
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(start + seg/2);
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillStyle = used ? "#4A5B7D" : "#FFFFFF";
    ctx.font = "bold 34px Cambria, Georgia, serif";
    ctx.fillText(used ? "✓" : String(board[i].n), R-24, 0);
    ctx.restore();
  }
  // aro interior
  ctx.beginPath(); ctx.arc(cx,cy,R*0.20,0,Math.PI*2);
  ctx.fillStyle = "#0B1E45"; ctx.fill();
  ctx.strokeStyle="#D4AF37"; ctx.lineWidth=6; ctx.stroke();
}

  app.innerHTML = `
    <div class="center">
      <div class="badge">CASA ABIERTA · UDR VALLE DEL GUAMUEZ</div>
      <h1>🎡 Ruleta Unadista</h1>
      <p class="sub">Gira la ruleta y responde. ${SEGMENTS} casillas, ${SEGMENTS} preguntas distintas cada partida.</p>
      <div class="prize-box">
        <h3>🏆 Premios</h3>
        ${PRIZES.map(p=>`<div class="prize-row"><span class="prize-medal">${p.medal}</span><span>${p.text}</span></div>`).join("")}
      </div>
      <div class="field">
        <label>Tu nombre <span style="color:#6E86B8;font-weight:normal;">(opcional)</span></label>
        <input id="inpNombre" placeholder="Ej: María Fernanda López" maxlength="40" />
      </div>
      <button class="primary-btn" onclick="startGame()">Comenzar 🎡</button>
      <div class="footer-note">UDR Valle del Guamuez · Zona Sur UNAD</div>
    </div>`;
}

function startGame(){
  ac(); // desbloquear audio con el clic del usuario
  const inp = document.getElementById("inpNombre");
  player.nombre = inp && inp.value.trim() ? inp.value.trim() : "Invitado";
  // Elegir SEGMENTS preguntas al azar del banco
  const picked = shuffle(BANK).slice(0, SEGMENTS);
  board = picked.map((q,i)=>({ n:i+1, q, used:false }));
  score = 0; played = 0; wheelAngle = 0;
  renderWheel();
}

function renderWheel(){
  const restantes = board.filter(b=>!b.used).length;
  const app = document.getElementById("app");
  app.innerHTML = `
    <button class="sound-toggle" id="sndBtn" onclick="toggleSound()">${soundOn?"🔊":"🔇"}</button>
    <div class="center">
      <h1 style="font-size:24px;">🎡 Ruleta Unadista</h1>
      <div class="stats-row">
        <span class="chip gold">⭐ ${score} aciertos</span>
        <span class="chip ice">🎯 ${played} jugadas</span>
        <span class="chip ice">🎡 ${restantes} casillas</span>
      </div>
      <div class="wheel-stage">
        <div class="pointer"></div>
        <canvas id="wheel" style="transform:rotate(${wheelAngle}deg);"></canvas>
        <div class="hub">RETO<br>UNAD</div>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spin()">${restantes? "¡GIRAR!" : "Ver resultado"}</button>
      <div class="spin-hint">${restantes? "Presiona para girar la ruleta" : "Ya usaste todas las casillas"}</div>
      <button class="restart-btn" onclick="confirmRestart()">🔄 Reiniciar juego</button>
    </div>`;
  drawWheel();
  if(!board.filter(b=>!b.used).length){
    document.getElementById("spinBtn").onclick = renderEnd;
  }
}

function spin(){
  if(spinning) return;
  const disponibles = board.map((b,i)=>({b,i})).filter(x=>!x.b.used);
  if(!disponibles.length){ renderEnd(); return; }
  spinning = true;
  const btn = document.getElementById("spinBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Girando…"; }

  // elegir casilla ganadora al azar entre las disponibles
  const chosen = disponibles[Math.floor(Math.random()*disponibles.length)];
  currentSeg = chosen.i;

  const segAng = 360/SEGMENTS;
  // el puntero está arriba; para que el centro del segmento i quede arriba:
  const targetBase = 360 - (chosen.i*segAng + segAng/2);
  const vueltas = 5 + Math.floor(Math.random()*3);       // 5-7 vueltas
  const jitter = (Math.random()-0.5) * (segAng*0.5);      // no siempre exacto al centro
  const finalAngle = wheelAngle + vueltas*360 + ((targetBase - (wheelAngle%360)) + 360)%360 + jitter;

  const cv = document.getElementById("wheel");
  cv.style.transition = `transform ${SPIN_MS}ms cubic-bezier(.17,.67,.19,1)`;
  // forzar reflow para que aplique la transición
  void cv.offsetWidth;
  cv.style.transform = `rotate(${finalAngle}deg)`;
  wheelAngle = finalAngle;

  startSuspense(SPIN_MS);
  setTimeout(()=>{
    stopSuspense();
    playBingo();
    spinning = false;
    setTimeout(()=>renderQuestion(chosen.i), 700);
  }, SPIN_MS);
}

function renderQuestion(segIdx){
  const item = board[segIdx];
  const q = item.q;
  const app = document.getElementById("app");
  const tipo = q.type==='mc' ? 'OPCIÓN MÚLTIPLE' : q.type==='tf' ? 'VERDADERO O FALSO' : 'RELACIONA';

  let body = "";
  if(q.type==="mc"){
    body = `<div class="options">` + q.opts.map((o,i)=>
      `<button class="opt" onclick="answerMC(${segIdx},${i})">${escapeHtml(o)}</button>`).join("") + `</div>`;
  } else if(q.type==="tf"){
    body = `<div class="tf-row">
      <button class="opt" onclick="answerTF(${segIdx},true)">✅ Verdadero</button>
      <button class="opt" onclick="answerTF(${segIdx},false)">❌ Falso</button>
    </div>`;
  } else {
    // "match" → se convierte en opción múltiple para que se lea grande
    const p = q.pairs[0];
    const distract = shuffle(q.pairs.slice(1).map(x=>x[1])).slice(0,3);
    const opts = shuffle([p[1], ...distract]);
    item._opts = opts; item._ans = opts.indexOf(p[1]); item._prompt = "¿Con cuál se relaciona “"+p[0]+"”?";
    body = `<div class="options">` + opts.map((o,i)=>
      `<button class="opt" onclick="answerMatch(${segIdx},${i})">${escapeHtml(o)}</button>`).join("") + `</div>`;
  }

  app.innerHTML = `
    <button class="sound-toggle" id="sndBtn" onclick="toggleSound()">${soundOn?"🔊":"🔇"}</button>
    <div class="center">
      <div class="q-num-big">${item.n}</div><br>
      <span class="qtype">${tipo}</span>
      <div class="question-big">${escapeHtml(item._prompt || q.q)}</div>
    </div>
    ${body}
    <div class="feedback" id="feedback"></div>
    <div class="center">
      <button class="next-btn" id="nextBtn" style="display:none;" onclick="backToWheel()">Volver a la ruleta 🎡</button>
      <div><button class="restart-btn" onclick="confirmRestart()">🔄 Reiniciar juego</button></div>
    </div>
  `;
}

function lockAll(){ document.querySelectorAll(".opt").forEach(b=>{ b.classList.add("locked"); b.onclick=null; }); }
function showNext(){ const b=document.getElementById("nextBtn"); if(b) b.style.display="inline-block"; }

function resolve(segIdx, chosenIdx, correctIdx){
  const btns = document.querySelectorAll(".opt");
  lockAll();
  if(btns[chosenIdx]) btns[chosenIdx].classList.add(chosenIdx===correctIdx?"correct":"incorrect");
  if(chosenIdx!==correctIdx && btns[correctIdx]) btns[correctIdx].classList.add("correct");
  const fb = document.getElementById("feedback");
  if(chosenIdx===correctIdx){ score++; playCorrect(); fb.textContent="🎉 ¡Correcto!"; fb.style.color="#7CE0A6"; }
  else { playWrong(); fb.textContent="No era esa — ¡sigue intentando!"; fb.style.color="#F09C93"; }
  played++;
  board[segIdx].used = true;   // la casilla se elimina de la ruleta
  showNext();
}
function answerMC(segIdx, i){ resolve(segIdx, i, board[segIdx].q.answer); }
function answerTF(segIdx, val){
  const correctIdx = board[segIdx].q.answer===true ? 0 : 1;
  resolve(segIdx, val===true?0:1, correctIdx);
}
function answerMatch(segIdx, i){ resolve(segIdx, i, board[segIdx]._ans); }

function backToWheel(){
  if(board.filter(b=>!b.used).length===0){ renderEnd(); return; }
  renderWheel();
}

/* Reinicia la partida: vuelve a la pantalla de inicio con preguntas nuevas.
   Pide confirmación para evitar reinicios accidentales durante el evento. */
function confirmRestart(){
  if(spinning) return;               // no interrumpir un giro en curso
  const jugadas = played;
  if(jugadas > 0){
    const ok = confirm("¿Reiniciar el juego?\n\nSe perderá el progreso actual (" + score + " de " + jugadas + " aciertos) y la ruleta cargará 20 preguntas nuevas.");
    if(!ok) return;
  }
  stopSuspense();
  restartGame();
}

/* Vuelve a la pantalla inicial para que pase el siguiente participante */
function restartGame(){
  spinning = false;
  board = []; score = 0; played = 0; wheelAngle = 0; currentSeg = null;
  renderStart();
}

function renderEnd(){
  const app = document.getElementById("app");
  const pct = played ? Math.round((score/played)*100) : 0;
  let emoji="🌱", msg="¡Buen comienzo! Repasa lo de hoy y vuelve a girar.";
  if(pct>=80){ emoji="🏆"; msg="¡Excelente! Conoces muy bien la UNAD."; }
  else if(pct>=50){ emoji="🎯"; msg="¡Vas muy bien! Un repaso más y lo tienes todo."; }
  playBingo();
  app.innerHTML = `
    <div class="center">
      <div class="end-emoji">${emoji}</div>
      <div class="end-score">${score} / ${played}</div>
      <div class="end-msg">${msg}</div>
      <div class="chip gold" style="display:inline-block;">${escapeHtml(player.nombre)}</div>
      <div class="prize-box" style="margin-top:16px;">
        <h3>🎁 Premios</h3>
        ${PRIZES.map(p=>`<div class="prize-row"><span class="prize-medal">${p.medal}</span><span>${p.text}</span></div>`).join("")}
      </div>
      <button class="primary-btn" onclick="renderStart()">Otro participante</button>
      <div class="footer-note">Casa Abierta · UDR Valle del Guamuez · Banco de ${BANK.length} preguntas</div>
    </div>`;
}

renderStart();
</script>
</body>
</html>
